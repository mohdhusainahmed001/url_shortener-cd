
 
syntax = "proto3";
 
package rocksbdhandler;
 
option java_multiple_files = true;
option java_package = "com.onextel.rocksdbhandler.proto";
option java_outer_classname = "MessageStateStoreProto";
 
// Key uniquely identifies a message
message Key {
  string channel = 1;
  string identifier = 2;
  string msg_uuid = 3;
}
 
// The value is just a JSON string
message Value {
  string json_payload = 1;
  optional int64 stored_at = 2;
}
 
// Requests/Responses
message PutRequest {
  Key key = 1;
  Value value = 2;
  bool if_absent = 3;
}
 
message PutResponse {
  bool created = 1;
  Value value = 2;
}
 
message GetRequest {
  Key key = 1;
}
 
message GetResponse {
  Value value = 1;
}
 
message DeleteRequest {
  Key key = 1;
}
 
message DeleteResponse {
  bool deleted = 1;
}
 
service MessageStateStore {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
}